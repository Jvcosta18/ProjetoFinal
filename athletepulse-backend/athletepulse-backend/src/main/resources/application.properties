spring.application.name=athletepulse-backend

# ===== BANCO DE DADOS (PostgreSQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/athletepulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-0123456789abcdef}
app.jwt.expiracao-ms=86400000

# ===== CORS =====
app.cors.origens-permitidas=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:63343

# ===== PORTA (Ajuste dinâmico para o Render) =====
server.port=${PORT:8080}