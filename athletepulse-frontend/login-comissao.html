<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Comissão Técnica | AthletePulse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./estilos/auth.css">
</head>

<body class="auth-page staff">

  <div class="auth-card">
    <div class="role-tag">CT</div>
    <h1 class="auth-title">Comissão Técnica</h1>
    <span class="auth-subtitle">Visão do elenco</span>

    <div class="auth-alert" id="alertLogin"></div>

    <form id="formLogin" class="auth-form" data-role="comissao">
      <span class="field-label">Email</span>
      <input class="auth-input" type="email" id="email" placeholder="voce@email.com" autocomplete="email">
      <small class="error" id="erroEmail"></small>

      <span class="field-label">Senha</span>
      <input class="auth-input" type="password" id="senha" placeholder="Sua senha" autocomplete="current-password">
      <small class="error" id="erroSenha"></small>

      <button class="auth-button" type="submit">Entrar</button>

      <p class="auth-text">
        Não tem conta? <a class="auth-link" href="cadastro.html">Cadastrar-se</a>
      </p>
    </form>
  </div>

<script src="./js/config.js"></script>
<script src="./js/validators.js"></script>
<script src="./js/login.js"></script>
</body>
</html>
