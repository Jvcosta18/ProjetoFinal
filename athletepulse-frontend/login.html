<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha seu perfil | AthletePulse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./estilos/estiloslogin.css">
</head>
<body>

  <div class="right">
    <div class="container">
      <div class="eyebrow">Acesso à plataforma</div>
      <h1>Escolha seu perfil</h1>
      <p>Selecione como você acessa o AthletePulse.</p>

      <div class="cards">
        <div class="card" onclick="irPara('jogador')">
          <div class="jersey-tag">JG</div>
          <h2>Jogador</h2>
          <p>Check-in diário de sono, dor e humor.</p>
        </div>

        <div class="card" onclick="irPara('tecnico')">
          <div class="jersey-tag">CT</div>
          <h2>Comissão Técnica</h2>
          <p>Visão completa do elenco.</p>
        </div>

        <div class="card" onclick="irPara('psicologo')">
          <div class="jersey-tag">PSI</div>
          <h2>Psicóloga(o)</h2>
          <p>Acompanhamento individual dos atletas.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function irPara(tipo) {
      if (tipo === "jogador") {
        window.location.href = "login-jogador.html";
      }

      if (tipo === "tecnico") {
        window.location.href = "login-comissao.html";
      }

      if (tipo === "psicologo") {
        window.location.href = "login-psicologo.html";
      }
    }
  </script>

</body>
</html>
