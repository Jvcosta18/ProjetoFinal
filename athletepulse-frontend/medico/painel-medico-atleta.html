<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesões | AthletePulse</title>

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta name="description" content="Histórico de lesões e avaliação médica do atleta.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../estilos/painel.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#e4a33b" stroke-width="2"/>
        <path d="M5 17 H11 L14 10 L18 24 L21 17 H27" stroke="#f5f1e6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AthletePulse
    </div>
    <div class="topbar-user">
      <span id="nomeUsuario"></span>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>
  </div>

  <div class="painel">
    <a href="painel-medico.html" class="link-voltar">← Voltar para o elenco</a>

    <div class="painel-head">
      <div class="eyebrow">Departamento Médico</div>
      <h1 id="nomeAtleta">Atleta</h1>
    </div>

    <div class="painel-card">
      <h2>Nova avaliação</h2>
      <span class="sub">Registrar lesão ou atualizar status de liberação</span>

      <div class="alert-box" id="alertLesao"></div>

      <form id="formLesao">
        <span class="field-label">Descrição</span>
        <input class="field-input" type="text" id="descricao" placeholder="Ex: Entorse de tornozelo direito">
        <small class="error" id="erroDescricao"></small>

        <div class="form-linha">
          <div>
            <span class="field-label">Gravidade</span>
            <select class="select-input" id="gravidade">
              <option value="leve">Leve</option>
              <option value="moderada">Moderada</option>
              <option value="grave">Grave</option>
            </select>
          </div>
          <div>
            <span class="field-label">Status de liberação</span>
            <select class="select-input" id="status">
              <option value="em_avaliacao">Em avaliação</option>
              <option value="em_recuperacao">Em recuperação</option>
              <option value="liberado_com_restricao">Liberado com restrição</option>
              <option value="liberado_total">Liberado total</option>
            </select>
          </div>
        </div>

        <span class="field-label">Previsão de retorno (opcional)</span>
        <input class="field-input" type="date" id="previsaoRetorno">

        <span class="field-label">Observações (opcional)</span>
        <textarea class="field-input" id="observacoes" rows="3" maxlength="1000"></textarea>

        <button class="btn-primario" type="submit" id="btnSalvar">Salvar avaliação</button>
      </form>
    </div>

    <div class="painel-card">
      <h2>Histórico</h2>
      <span class="sub">Registros anteriores</span>
      <div id="listaLesoes">
        <div class="spinner-carregando"><span class="spinner"></span>Carregando...</div>
      </div>
    </div>
  </div>

<script src="../js/config.js"></script>
<script src="../js/validators.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/painel-medico-atleta.js"></script>
</body>
</html>
