<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas | AthletePulse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../estilos/painel.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#e4a33b" stroke-width="2"/>
        <path d="M5 17 H11 L14 10 L18 24 L21 17 H27" stroke="#f5f1e6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AthletePulse
    </div>
    <div class="topbar-user">
      <span id="nomeUsuario"></span>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>
  </div>

  <div class="painel">
    <a href="painel-psicologo.html" class="link-voltar">← Voltar para todos os atletas</a>

    <div class="painel-head">
      <div class="eyebrow">Psicologia</div>
      <h1>Histórico de acompanhamento</h1>
    </div>

    <span class="confidencial-tag">🔒 Visível apenas para a psicologia</span>

    <div class="painel-card">
      <h2>Nova nota</h2>
      <span class="sub">Registro de sessão ou observação</span>

      <div class="alert-box" id="alertNota"></div>

      <form id="formNota">
        <textarea class="field-input" id="texto" rows="4" maxlength="2000" placeholder="Escreva aqui..."></textarea>
        <small class="error" id="erroTexto"></small>

        <button class="btn-primario" type="submit" id="btnSalvar">Salvar nota</button>
      </form>
    </div>

    <div class="painel-card">
      <h2>Histórico</h2>
      <span class="sub">Notas anteriores</span>
      <div id="listaNotas"></div>
    </div>
  </div>

<script src="../../js/config.js"></script>
<script src="../../js/validators.js"></script>
<script src="../../js/auth-guard.js"></script>
<script src="../../js/painel-psicologo-atleta.js"></script>
</body>
</html>
