<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento | AthletePulse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./estilos/painel.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#e4a33b" stroke-width="2"/>
        <path d="M5 17 H11 L14 10 L18 24 L21 17 H27" stroke="#f5f1e6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AthletePulse
    </div>
    <div class="topbar-user">
      <span id="nomeUsuario"></span>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>
  </div>

  <div class="painel">
    <div class="painel-head">
      <div class="eyebrow">Psicologia</div>
      <h1>Acompanhamento emocional</h1>
      <p>Estado emocional do dia de cada atleta. Clique em alguém para ver o histórico de notas.</p>
    </div>

    <div class="resumo-elenco" id="resumoAtletas"></div>

    <div class="grid-elenco" id="gridAtletas"></div>
  </div>

<script src="./js/config.js"></script>
<script src="./js/validators.js"></script>
<script src="./js/auth-guard.js"></script>
<script src="./js/painel-psicologo.js"></script>
</body>
</html>
