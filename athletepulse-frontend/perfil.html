<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil | AthletePulse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./estilos/painel.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15" stroke="#e4a33b" stroke-width="2"/>
        <path d="M5 17 H11 L14 10 L18 24 L21 17 H27" stroke="#f5f1e6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AthletePulse
    </div>
    <div class="topbar-user">
      <a href="#" id="linkVoltar" class="nav-link-topo">Voltar</a>
      <span id="nomeUsuario"></span>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>
  </div>

  <div class="painel">
    <div class="painel-head">
      <div class="eyebrow">Sua conta</div>
      <h1>Meu Perfil</h1>
      <p>Atualize seu nome ou troque sua senha.</p>
    </div>

    <div class="painel-card">
      <h2>Dados da conta</h2>
      <span class="sub">Email: <span id="emailAtual"></span> · Perfil: <span id="perfilAtual"></span></span>

      <div class="alert-box" id="alertNome"></div>

      <form id="formNome">
        <span class="field-label">Nome completo</span>
        <input class="field-input" type="text" id="nomeAtual" placeholder="Seu nome">
        <small class="error" id="erroNome"></small>

        <button class="btn-primario" type="submit" id="btnSalvarNome">Salvar nome</button>
      </form>
    </div>

    <div class="painel-card">
      <h2>Trocar senha</h2>
      <span class="sub">Por segurança, informe a senha atual</span>

      <div class="alert-box" id="alertSenha"></div>

      <form id="formSenha">
        <span class="field-label">Senha atual</span>
        <input class="field-input" type="password" id="senhaAtual" autocomplete="current-password">
        <small class="error" id="erroSenhaAtual"></small>

        <span class="field-label">Nova senha</span>
        <input class="field-input" type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        <small class="error" id="erroNovaSenha"></small>

        <span class="field-label">Confirmar nova senha</span>
        <input class="field-input" type="password" id="confirmarNovaSenha" autocomplete="new-password">
        <small class="error" id="erroConfirmarSenha"></small>

        <button class="btn-primario" type="submit" id="btnSalvarSenha">Trocar senha</button>
      </form>
    </div>
  </div>

<script src="./js/config.js"></script>
<script src="./js/validators.js"></script>
<script src="./js/auth-guard.js"></script>
<script src="./js/perfil.js"></script>
</body>
</html>
