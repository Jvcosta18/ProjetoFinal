<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Jogador</title>
<link rel="stylesheet" href="./estilos/auth.css">
</head>

<body class="auth-page player">

  <div class="auth-card">
    <h1 class="auth-title">Área do Jogador</h1>

    <div class="auth-form">
      <input class="auth-input" type="email" placeholder="Email">
      <input class="auth-input" type="password" placeholder="Senha">

      <button class="auth-button">Entrar</button>

      <p class="auth-text">
        Não tem conta? <a class="auth-link" href="cadastro.html">Cadastrar-se</a>
      </p>
    </div>
  </div>

</body>
</html>
